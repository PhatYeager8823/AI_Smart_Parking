services:
  # Database Chính (Lưu nhật ký, người dùng)
  postgres:
    image: postgres:15-alpine
    container_name: parking_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_parking}
      POSTGRES_USER: ${POSTGRES_USER:-parking_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # Vector Database (Lưu vector đặc trưng khuôn mặt)
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: parking_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # Quản lý Database trực quan
  pgadmin:
    image: dpage/pgadmin4
    container_name: parking_pgadmin
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:
  qdrant_data:
  pgadmin_data:

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Biển Số Mobile</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body, html { 
            width: 100vw; height: 100vh; background-color: #0f172a; 
            overflow: hidden; display: flex; flex-direction: column; 
        }

        /* HEADER */
        .header {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
            padding: 20px; text-align: center; color: white;
            background: linear-gradient(to bottom, rgba(15,23,42,0.9), transparent);
            font-weight: 800; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* KHU VỰC CAMERA */
        .camera-container {
            flex: 1; position: relative; width: 100%; height: 100%; background: #000;
        }
        #video-feed, #preview-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        #preview-img { display: none; z-index: 5; }

        /* MẶT NẠ & KHUNG QUÉT KÉP (OVERLAY) */
        .guideline-overlay {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; height: 350px;
            /* Phủ đen mờ 75% xung quanh khung */
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.75);
            border-radius: 20px;
            /* KHUNG NGOÀI: Giới hạn Padding cho AI */
            border: 2px dashed rgba(255, 255, 255, 0.3);
            display: flex; justify-content: center; align-items: center;
            z-index: 3; pointer-events: none;
        }
        .instruction-text {
            position: absolute; top: -40px; width: 100%; text-align: center;
            color: #0ea5e9; font-weight: 800; font-size: 0.95rem; text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        /* KHUNG TRONG: Ép người dùng canh biển số (Hình chữ nhật ngang) */
        .inner-target { 
            width: 240px; height: 160px; position: relative; 
            background: rgba(14, 165, 233, 0.05);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 12px;
            box-sizing: border-box;
        }
        .inner-target::before, .inner-target::after, .corners::before, .corners::after {
            content: ''; position: absolute; width: 30px; height: 30px; border-color: #0ea5e9; border-style: solid;
            z-index: 5;
        }
        /* Căn chỉnh lại để không bị lồi ra ngoài biên */
        .inner-target::before { top: -2px; left: -2px; border-width: 5px 0 0 5px; border-radius: 12px 0 0 0; }
        .inner-target::after { top: -2px; right: -2px; border-width: 5px 5px 0 0; border-radius: 0 12px 0 0; }
        .corners::before { bottom: -2px; left: -2px; border-width: 0 0 5px 5px; border-radius: 0 0 0 12px; }
        .corners::after { bottom: -2px; right: -2px; border-width: 0 5px 5px 0; border-radius: 0 0 12px 0; }

        /* NÚT CHỤP ẢNH CHÍNH */
        .capture-controls {
            position: absolute; bottom: 40px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 10;
        }
        .btn-capture {
            width: 75px; height: 75px; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 4px solid white;
            backdrop-filter: blur(5px); box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* TOAST SYSTEM */
        #toast-container { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast-box { 
            background: rgba(255, 255, 255, 0.95); padding: 12px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 10px; animation: slideDown 0.3s ease; transition: all 0.4s;
            backdrop-filter: blur(5px);
        }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-success { border-left: 5px solid #10b981; }
        .toast-danger { border-left: 5px solid #f43f5e; }
        .toast-box i { font-size: 1.1rem; }
        .toast-success i { color: #10b981; }
        .toast-danger i { color: #f43f5e; }
        .toast-box span { font-weight: 700; font-size: 0.9rem; color: #1e293b; }

        .btn-capture .inner-circle {
            width: 55px; height: 55px; border-radius: 50%; background: white; transition: transform 0.1s;
        }
        .btn-capture:active .inner-circle { transform: scale(0.85); background: #e2e8f0; }

        /* BOTTOM SHEET (MENU XÁC NHẬN) */
        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 20;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
            padding: 30px 20px 40px 20px; border-radius: 30px 30px 0 0;
            border-top: 1px solid rgba(255,255,255,0.1); box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            display: none; flex-direction: column; gap: 15px;
            animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .btn-group { display: flex; gap: 15px; width: 100%; }
        .btn-action {
            flex: 1; padding: 18px 10px; border-radius: 20px; border: none;
            font-weight: 800; font-size: 1rem; color: white; display: flex;
            flex-direction: column; align-items: center; gap: 8px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .btn-action:active { transform: scale(0.95); }
        .btn-action i { font-size: 1.5rem; margin-bottom: 2px; }
        .btn-send-in { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-send-out { background: linear-gradient(135deg, #f43f5e, #e11d48); }
        
        .btn-retry {
            width: 100%; background: transparent; color: #94a3b8;
            border: 2px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 16px;
            font-weight: 800; font-size: 1rem; cursor: pointer; display: flex;
            justify-content: center; align-items: center; gap: 10px;
        }

        /* THÔNG BÁO TOAST */
        #status-msg {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
            padding: 12px 25px; color: white; font-weight: 800; font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 50; display: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="header">TRẠM QUÉT BIỂN SỐ</div>
    
    <div class="camera-container">
        <video id="video-feed" autoplay playsinline></video>
        <img id="preview-img" alt="Ảnh chụp trước" />
        
        <div class="guideline-overlay" id="overlay">
            <div class="instruction-text">Canh biển số khớp khung trong</div>
            
            <div class="inner-target">
                <div class="corners"></div>
            </div>
        </div>
        
        <!-- Toast Container -->
        <div id="toast-container"></div>
        
        <div id="status-msg">Đang gửi ảnh...</div>
    </div>

    <div class="capture-controls" id="capture-controls">
        <div class="btn-capture" id="capture-btn">
            <div class="inner-circle"></div>
        </div>
    </div>

    <div class="bottom-sheet" id="confirm-controls">
        <div class="btn-group">
            <button class="btn-action btn-send-in" id="send-in-btn">
                <i class="fas fa-sign-in-alt"></i> LÀN VÀO
            </button>
            <button class="btn-action btn-send-out" id="send-out-btn">
                <i class="fas fa-sign-out-alt"></i> LÀN RA
            </button>
        </div>
        <button class="btn-retry" id="retry-btn">
            <i class="fas fa-redo"></i> Chụp lại ảnh khác
        </button>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        // --- TOAST SYSTEM ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-box toast-${type}`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-10px)'; setTimeout(() => toast.remove(), 400); }, 3000);
        }

        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('canvas');
        const previewImg = document.getElementById('preview-img');
        const captureBtn = document.getElementById('capture-btn');
        const retryBtn = document.getElementById('retry-btn');
        const statusMsg = document.getElementById('status-msg');
        
        let currentBase64 = "";

        // Bật Camera sau (CẦM DỌC ĐIỆN THOẠI)
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment', 
                        width: { ideal: 1080 }, 
                        height: { ideal: 1920 } 
                    }
                });
                video.srcObject = stream;
            } catch (err) {
                showToast("Không thể truy cập Camera. " + err, "danger");
            }
        }

        // Bấm nút chụp
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            currentBase64 = canvas.toDataURL('image/jpeg', 0.9);
            
            previewImg.src = currentBase64;
            previewImg.style.display = 'block';
            document.getElementById('overlay').style.display = 'none';
            video.style.opacity = '0';

            document.getElementById('capture-controls').style.display = 'none';
            document.getElementById('confirm-controls').style.display = 'flex';
        });

        // Bấm nút chụp lại
        retryBtn.addEventListener('click', () => {
            previewImg.style.display = 'none';
            document.getElementById('overlay').style.display = 'flex';
            video.style.opacity = '1';

            document.getElementById('capture-controls').style.display = 'flex';
            document.getElementById('confirm-controls').style.display = 'none';
        });

        // Gửi dữ liệu
        async function sendToSystem(lane) {
            statusMsg.style.display = 'block';
            statusMsg.innerText = `⏳ Đang gửi LÀN ${lane === 'IN' ? 'VÀO' : 'RA'}...`;
            statusMsg.style.color = "#0ea5e9";
            
            document.getElementById('send-in-btn').disabled = true;
            document.getElementById('send-out-btn').disabled = true;
            retryBtn.disabled = true;

            // Sửa lỗi: thêm timeout 15 giây để tránh chờ vô hạn nếu server không phản hồi
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const resp = await fetch('/api/upload_mobile_plate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: currentBase64, lane: lane }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await resp.json();
                if(data.status === 'success') {
                    statusMsg.innerHTML = `<i class="fas fa-check-circle"></i> THÀNH CÔNG!`;
                    statusMsg.style.color = "#10b981";
                    // Tăng delay lên 3 giây (3000ms) để tránh quét nhầm biển cũ
                    setTimeout(() => { resetUI(); }, 3000); 
                } else {
                    statusMsg.innerText = "❌ Lỗi: " + data.message;
                    statusMsg.style.color = "#f43f5e";
                    enableButtons();
                }
            } catch(e) {
                clearTimeout(timeoutId);
                if (e.name === 'AbortError') {
                    statusMsg.innerText = "⏰ Hết thời gian chờ (15s). Kiểm tra kết nối!";
                } else {
                    statusMsg.innerText = "❌ Lỗi kết nối Server.";
                }
                statusMsg.style.color = "#f43f5e";
                enableButtons();
            }
        }

        function resetUI() {
            previewImg.style.display = 'none';
            document.getElementById('overlay').style.display = 'flex';
            video.style.opacity = '1';
            document.getElementById('capture-controls').style.display = 'flex';
            document.getElementById('confirm-controls').style.display = 'none';
            statusMsg.style.display = 'none';
            enableButtons();
        }

        function enableButtons() {
            document.getElementById('send-in-btn').disabled = false;
            document.getElementById('send-out-btn').disabled = false;
            retryBtn.disabled = false;
        }

        document.getElementById('send-in-btn').addEventListener('click', () => sendToSystem('IN'));
        document.getElementById('send-out-btn').addEventListener('click', () => sendToSystem('OUT'));
        retryBtn.addEventListener('click', resetUI);

        startCamera();
    </script>
</body>
</html>
